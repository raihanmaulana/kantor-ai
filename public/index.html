<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kantor Arus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
<style>
/* Layout: kantor 3D dominan di kiri, panel keuangan di kanan (bisa disembunyikan); di HP jadi dua tab */
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
:root{
  --bg:#eceef3; --panel:#ffffff; --panel-2:#f6f7fa; --fg:#191d2b; --muted:#5b6276; --line:#d8dbe5;
  --accent:#3546c4; --accent-soft:#e3e6fb; --scene:#9ec9ec; --ok:#2f8a52; --warn:#a8641a; --bad:#b4372f; --code:#f4f5f9;
  --display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10131b; --panel:#181c27; --panel-2:#1e2331; --fg:#e6e8ef; --muted:#9aa1b4; --line:#2a3041;
  --accent:#8e99ff; --accent-soft:#252b4a; --scene:#16213f; --ok:#5cc184; --warn:#e3b05a; --bad:#ff8a80; --code:#11141d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10131b; --panel:#181c27; --panel-2:#1e2331; --fg:#e6e8ef; --muted:#9aa1b4; --line:#2a3041;
  --accent:#8e99ff; --accent-soft:#252b4a; --scene:#16213f; --ok:#5cc184; --warn:#e3b05a; --bad:#ff8a80; --code:#11141d; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
.app{height:100%;display:flex;flex-direction:column;gap:10px;
  padding-left:max(14px, env(safe-area-inset-left, 0px));padding-right:max(14px, env(safe-area-inset-right, 0px));padding-block:10px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{display:flex;flex-direction:column;gap:1px;margin-right:auto;min-width:0}
.brand h1{font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:-.01em;margin:0;line-height:1.1}
.brand p{margin:0;color:var(--muted);font-size:12.5px}
.clock{display:flex;align-items:baseline;gap:9px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.clock b{font-size:21px;font-weight:500}
.clock span{color:var(--muted);font-size:12px}
.controls{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button{font-size:13px;font-weight:500;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--panel)}
button.danger{border-color:var(--bad);color:var(--bad)}
button.link{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;border-radius:0;border-right:1px solid var(--line);padding:6px 10px}
.seg button:last-child{border-right:0}
.seg.mono button{font-family:var(--mono)}
#eco .lf{display:inline-block;width:8px;height:8px;border-radius:50%;border:1.5px solid currentColor;margin-right:6px;vertical-align:0}
#eco[aria-pressed="true"] .lf{background:currentColor}

.tabs{display:none}
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) clamp(420px,36vw,620px);gap:10px}
.main.wide{grid-template-columns:minmax(0,.9fr) minmax(0,1.4fr)}
.main.hide-board{grid-template-columns:minmax(0,1fr)}
.main.hide-board .board{display:none}

/* kantor */
.stage{position:relative;border-radius:14px;overflow:hidden;background:var(--scene);border:1px solid var(--line);min-height:0}
#c{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#c.dragging{cursor:grabbing}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:3px;white-space:nowrap;will-change:transform}
.tag .nm{font-family:var(--display);font-weight:600;font-size:11.5px;background:var(--panel);color:var(--fg);padding:1px 8px 2px;border-radius:99px;border:1.5px solid var(--c);box-shadow:0 2px 8px rgba(10,14,30,.18);display:flex;gap:5px;align-items:center}
.tag .st{font-size:10.5px;color:var(--fg);background:color-mix(in srgb, var(--panel) 90%, transparent);padding:1px 7px;border-radius:6px;max-width:200px;overflow:hidden;text-overflow:ellipsis;transition:opacity .3s}
.tag .pg{width:44px;height:4px;border-radius:2px;background:color-mix(in srgb, var(--panel) 70%, transparent);overflow:hidden}
.tag .pg i{display:block;height:100%;width:35%;background:var(--c);animation:slide 1.4s ease-in-out infinite}
.tag.far .st{opacity:0}
.tag.away{opacity:0}
.mtag{position:absolute;left:0;top:0;white-space:nowrap;pointer-events:none;font-size:10.5px;line-height:1.25;text-align:center;background:color-mix(in srgb, var(--panel) 92%, transparent);color:var(--fg);padding:2px 7px 3px;border-radius:7px;border:1px solid color-mix(in srgb, var(--fg) 14%, transparent);box-shadow:0 2px 8px rgba(10,14,30,.15);transition:box-shadow .4s}
.mtag b{display:block;font-family:var(--display);font-weight:600;font-size:11px}
.mtag .amt{font-variant-numeric:tabular-nums}
.mtag.neg .amt{color:#d64545}
.mtag.flash{box-shadow:0 0 0 4px rgba(92,193,132,.5)}
.mtag.legend{font-size:10px;opacity:.9}
.mtag.hide{display:none}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
.ov{position:absolute;font-size:11.5px;color:var(--fg);background:color-mix(in srgb, var(--panel) 85%, transparent);padding:4px 8px;border-radius:7px}
.badge-tl{left:10px;top:10px;font-family:var(--mono);display:flex;gap:10px}
.cam{left:10px;bottom:10px;padding:0}
.cam button{padding:5px 10px;font-size:12px}
.camctl{position:absolute;right:10px;bottom:10px;display:flex;gap:4px}
.camctl button{width:32px;height:32px;padding:0;font-size:16px}
.placeholder{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--fg)}
.placeholder div{background:color-mix(in srgb, var(--panel) 88%, transparent);padding:18px 22px;border-radius:12px;max-width:380px;line-height:1.5}
#profile{position:absolute;right:10px;top:10px;width:min(280px, calc(100% - 20px));background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:0 10px 30px rgba(10,14,30,.2);display:flex;flex-direction:column;gap:8px;z-index:5}
.pf-head{display:flex;gap:10px;align-items:center}
.pf-head strong{display:block;font-family:var(--display);font-size:16px}
.pf-head small{color:var(--muted)}
.pf-head .x{margin-left:auto;width:28px;height:28px;padding:0;font-size:18px;line-height:1}
.pf-act{margin:0;font-size:13px}
.pf-sub,.pf-foot{font-size:12px;color:var(--muted)}
.pf-tasks{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px;font-size:13px}
.pf-tasks li{display:flex;gap:6px;align-items:center;justify-content:space-between}
.av{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--c);color:#fff;font-size:9.5px;font-weight:600;flex:none}
.av.big{width:38px;height:38px;font-size:14px}

/* panel keuangan */
.board{background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.b-head{padding:12px 14px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.b-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.b-title h2{margin:0;font-family:var(--display);font-size:17px;margin-right:auto}
#conn{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--muted)}
#conn[data-s="terhubung"],#conn[data-s="demo"]{color:var(--ok)}
#conn[data-s="terputus"],#conn[data-s="butuh kunci"],#conn[data-s="gagal"],#conn[data-s="belum diatur"]{color:var(--warn)}
a.btn{font-size:13px;font-weight:500;border:1px solid var(--accent);background:var(--accent);color:var(--panel);border-radius:8px;padding:6px 11px;text-decoration:none}
.b-body{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:14px;padding:12px 14px 16px}
.status{border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);background:var(--panel-2)}
.status b{font-family:var(--display);font-size:16px;display:flex;align-items:center;gap:8px}
.status b i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.status ul{margin:0;padding-left:18px;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.status[data-l="aman"]{--c:var(--ok)} .status[data-l="waspada"]{--c:var(--warn);background:color-mix(in srgb, var(--warn) 10%, var(--panel))} .status[data-l="kritis"]{--c:var(--bad);background:color-mix(in srgb, var(--bad) 10%, var(--panel))}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.stats div{background:var(--panel-2);border-radius:9px;padding:8px 10px;display:flex;flex-direction:column;gap:1px;min-width:0}
.stats b{font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats span{font-size:11.5px;color:var(--muted)}
.stats .neg b{color:var(--bad)}
.sec{display:flex;flex-direction:column;gap:7px}
.sec h3{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:flex;gap:8px;align-items:center}
.sec h3 .av{font-size:9px}
.rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;font-size:13px}
.rows li{display:flex;flex-direction:column;gap:3px}
.rows .ln{display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.rows .ln span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.num{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:12.5px}
.bar{height:6px;border-radius:3px;background:var(--panel-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:3px}
.bar i.w{background:var(--warn)} .bar i.x{background:var(--bad)}
.chip{font-size:11px;font-weight:600;border-radius:6px;padding:1px 6px;white-space:nowrap}
.chip.lunas{background:color-mix(in srgb, var(--ok) 15%, var(--panel));color:var(--ok)}
.chip.terlambat{background:color-mix(in srgb, var(--bad) 15%, var(--panel));color:var(--bad)}
.chip.hari_ini,.chip.besok{background:color-mix(in srgb, var(--warn) 18%, var(--panel));color:var(--warn)}
.chip.nanti,.chip.dilewati{background:var(--panel-2);color:var(--muted)}
.empty{color:var(--muted);font-size:12.5px;line-height:1.45}
#feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;font-size:12.5px}
#feed li{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:8px;align-items:center}
#feed time{font-size:11px;color:var(--muted);font-family:var(--mono);white-space:nowrap}
.pos{color:var(--ok)} .negv{color:var(--bad)}
.setup{background:var(--panel-2);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.5}
.setup code{font-family:var(--mono);font-size:12px;background:var(--panel);padding:1px 5px;border-radius:5px}
.pf-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px;font-size:12.5px}
.pf-list li{display:flex;gap:8px;justify-content:space-between}
.blur .num,.blur .stats b,.blur .mtag .amt{filter:blur(6px)}

/* dialog */
dialog{border:1px solid var(--line);border-radius:14px;padding:0;background:var(--panel);color:var(--fg);width:min(520px, calc(100vw - 24px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgba(10,14,30,.45)}
dialog form{display:flex;flex-direction:column;gap:12px;padding:18px 18px 16px}
dialog h2{margin:0;font-family:var(--display);font-size:18px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label,.fld legend{font-size:12.5px;font-weight:600}
.fld input[type=text],.fld input[type=password],.fld input[type=date],.fld select,.fld textarea{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.fld textarea{min-height:80px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;gap:8px;align-items:center;font-size:13px}
fieldset{border:0;margin:0;padding:0}
.radios{display:flex;gap:14px}
.radios label{display:flex;gap:6px;align-items:center;font-weight:400;font-size:13px}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.actions .left{margin-right:auto;display:flex;gap:6px;align-items:center;font-size:12.5px}
.note{font-size:12px;color:var(--muted);margin:0}
.note.err,.err{color:var(--bad);font-size:12.5px;margin:0}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:var(--fg);color:var(--panel);padding:9px 14px;border-radius:9px;font-size:13px;opacity:0;pointer-events:none;transition:all .25s;z-index:20;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--bad)}

@media (max-width: 900px){
  html,body{height:auto}
  .app{height:auto;min-height:100%}
  .tabs{display:flex}
  .tabs button{flex:1}
  .main,.main.wide,.main.hide-board{grid-template-columns:minmax(0,1fr)}
  .main[data-tab="kantor"] .board{display:none}
  .main[data-tab="uang"] .stage{display:none}
  .main.hide-board[data-tab="uang"] .board{display:flex}
  .stage{height:70vh;min-height:380px}
  .board{overflow:visible}
  .b-body{overflow:visible}
    #toggle-board,#wide-board{display:none}
}
@media (prefers-reduced-motion: reduce){.tag .pg i{animation:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <h1>Kantor Arus</h1>
      <p id="team-line">Lantai 38 · tim keuangan pribadi Anda</p>
    </div>
    <div class="clock"><b id="clock">--:--</b><span id="day"></span></div>
    <div class="controls">
      <button id="pause" aria-pressed="false">Jeda</button>
      <div class="seg mono" role="group" aria-label="Kecepatan animasi">
        <button data-s="1" aria-pressed="true">1×</button>
        <button data-s="2" aria-pressed="false">2×</button>
        <button data-s="4" aria-pressed="false">4×</button>
      </div>
      <button id="eco" aria-pressed="false" title="Kurangi beban grafis supaya laptop lebih dingin dan baterai awet"><span class="lf"></span>Mode hemat</button>
      <button id="hide-num" aria-pressed="false" title="Samarkan semua nominal">Sembunyikan nominal</button>
      <button id="wide-board" aria-pressed="false">Perlebar panel</button>
      <button id="toggle-board" aria-pressed="false">Sembunyikan panel</button>
    </div>
  </header>

  <div class="tabs seg" role="tablist" aria-label="Tampilan">
    <button role="tab" data-tab="kantor" aria-pressed="true">Kantor</button>
    <button role="tab" data-tab="uang" aria-pressed="false">Keuangan</button>
  </div>

  <main class="main" id="main" data-tab="kantor">
    <section class="stage" id="stage" aria-label="Kantor 3D di lantai 38">
      <canvas id="c"></canvas>
      <div id="labels"></div>
      <div class="ov badge-tl"><span id="sky">Siang</span><span id="fps">30 fps</span></div>
      <div class="ov cam seg" role="group" aria-label="Mode kamera">
        <button id="cam-overview" aria-pressed="true">Overview</button>
        <button id="cam-follow" aria-pressed="false" title="Ikuti karyawan yang dipilih">Ikuti karyawan</button>
      </div>
      <div class="camctl">
        <button id="rl" title="Putar kiri" aria-label="Putar kiri">↺</button>
        <button id="rr" title="Putar kanan" aria-label="Putar kanan">↻</button>
        <button id="zi" title="Perbesar" aria-label="Perbesar">+</button>
        <button id="zo" title="Perkecil" aria-label="Perkecil">−</button>
      </div>
      <div id="profile" hidden></div>
      <div class="placeholder" id="office-placeholder"><div>Kantor 3D sedang disiapkan…</div></div>
    </section>

    <aside class="board" id="board" aria-label="Ringkasan keuangan">
      <div class="b-head">
        <div class="b-title"><h2 id="b-month">Keuangan</h2><span id="conn">menghubungkan</span><button id="btn-keys">Kunci</button><a class="btn" id="open-arus" href="#" target="_blank" rel="noopener" hidden>Buka Arus</a></div>
      </div>
      <div class="b-body" id="panel"></div>
    </aside>
  </main>
</div>

<dialog id="dlg-keys" aria-labelledby="k-heading">
  <form id="key-form" method="dialog" novalidate>
    <h2 id="k-heading">Kunci akses</h2>
    <div class="fld"><label for="k-read">Kunci baca (OFFICE_READ_KEY)</label><input type="password" id="k-read" autocomplete="off"><span class="note">Disimpan di browser ini saja.</span></div>
    <p class="note" id="k-msg" role="status"></p>
    <div class="actions">
      <button type="submit" value="cancel" formnovalidate>Tutup</button>
      <button type="submit" value="save" class="primary">Simpan kunci</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
